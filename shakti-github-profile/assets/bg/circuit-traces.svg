.zmono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace}
.zrt{font-family:"MS Gothic","Hiragino Kaku Gothic ProN","Noto Sans Mono CJK JP","Noto Sans CJK JP",ui-monospace,Menlo,Consolas,monospace}
.zmono:not(.zdraw),.zsans{paint-order:stroke;stroke:#03060A;stroke-opacity:.9;stroke-width:2.6px;stroke-linejoin:round}
.zserif{font-family:Georgia,"Times New Roman","Noto Serif","DejaVu Serif",serif}
.zsans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.zup{animation:zup 1s cubic-bezier(.16,1,.3,1) both}
.zchip{animation:zup .7s cubic-bezier(.34,1.56,.64,1) both}
.zrain{animation:zrain linear infinite}
.zpulse{animation:zpulse 2.4s ease-in-out infinite}
.zflick{animation:zflick 6s infinite}
.zdash{stroke-dasharray:6 8;animation:zdash 1.1s linear infinite}
.ztrace{stroke-dasharray:160 840;stroke-dashoffset:1000;animation:ztrace 8s linear infinite}
.ztype{transform-box:fill-box;transform-origin:left center;animation-name:ztype;animation-fill-mode:both}
.zglr{animation:zglr 6s steps(1) infinite;opacity:0}
.zglb{animation:zglb 6s steps(1) infinite;opacity:0}
.zdraw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:zdrawk 3.4s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes zup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zrain{from{transform:translateY(-320px)}to{transform:translateY(520px)}}
@keyframes zpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes zflick{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
@keyframes zdash{to{stroke-dashoffset:-14}}
@keyframes ztrace{to{stroke-dashoffset:0}}
@keyframes ztype{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes zdrawk{to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes zglr{0%,90%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-5px,0)}93%{opacity:.85;transform:translate(4px,2px)}95%{opacity:.85;transform:translate(-2px,-1px)}96%,100%{opacity:0;transform:none}}
@keyframes zglb{0%,90%{opacity:0;transform:none}91.5%{opacity:.85;transform:translate(5px,1px)}93.5%{opacity:.85;transform:translate(-4px,-2px)}96%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.zup,.zchip,.zrain,.zpulse,.zflick,.zdash,.ztrace,.zglr,.zglb,.ztype{animation:none}.ztrace{display:none}.zdraw{animation:none;stroke-dashoffset:0;fill-opacity:1}}

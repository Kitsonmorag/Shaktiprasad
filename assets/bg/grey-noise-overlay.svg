<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Grey noise, scanline and vignette overlay" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Grey noise, scanline and vignette overlay</title><defs>
<linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1218"/><stop offset="1" stop-color="#05070A"/></linearGradient>
<radialGradient id="ngb" cx="10%" cy="15%" r="60%"><stop offset="0" stop-color="#00E5FF" stop-opacity=".20"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
<radialGradient id="ngr" cx="92%" cy="90%" r="55%"><stop offset="0" stop-color="#FF2D55" stop-opacity=".20"/><stop offset="1" stop-color="#FF2D55" stop-opacity="0"/></radialGradient>
<linearGradient id="nray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00FF9C" stop-opacity=".55"/><stop offset="1" stop-color="#00FF9C" stop-opacity="0"/></linearGradient>
<linearGradient id="nbr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2D55"/></linearGradient>
<pattern id="ngrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".055"/></pattern>
<pattern id="nscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<radialGradient id="nvig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<filter id="nglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="nglow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="nnoise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="nclip"><rect width="1200" height="520" rx="0"/></clipPath></defs><style>
.nmono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace}
.nsans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.nup{animation:nup 1s cubic-bezier(.16,1,.3,1) both}
.nchip{animation:nup .7s cubic-bezier(.34,1.56,.64,1) both}
.nrain{animation:nrain linear infinite}
.npulse{animation:npulse 2.4s ease-in-out infinite}
.nflick{animation:nflick 6s infinite}
.ndash{stroke-dasharray:6 8;animation:ndash 1.1s linear infinite}
.ntrace{stroke-dasharray:160 840;stroke-dashoffset:1000;animation:ntrace 8s linear infinite}
.ntype{transform-box:fill-box;transform-origin:left center;animation-name:ntype;animation-fill-mode:both}
.nglr{animation:nglr 6s steps(1) infinite;opacity:0}
.nglb{animation:nglb 6s steps(1) infinite;opacity:0}
.ndraw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:ndrawk 3.4s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes nup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes nrain{from{transform:translateY(-320px)}to{transform:translateY(520px)}}
@keyframes npulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes nflick{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
@keyframes ndash{to{stroke-dashoffset:-14}}
@keyframes ntrace{to{stroke-dashoffset:0}}
@keyframes ntype{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ndrawk{to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes nglr{0%,90%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-5px,0)}93%{opacity:.85;transform:translate(4px,2px)}95%{opacity:.85;transform:translate(-2px,-1px)}96%,100%{opacity:0;transform:none}}
@keyframes nglb{0%,90%{opacity:0;transform:none}91.5%{opacity:.85;transform:translate(5px,1px)}93.5%{opacity:.85;transform:translate(-4px,-2px)}96%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.nup,.nchip,.nrain,.npulse,.nflick,.ndash,.ntrace,.nglr,.nglb,.ntype{animation:none}.ntrace{display:none}.ndraw{animation:none;stroke-dashoffset:0;fill-opacity:1}}
</style><rect width="1200" height="520" fill="#9AA4B2" opacity=".035"/><rect width="1200" height="520" filter="url(#nnoise)" opacity=".07"/><rect width="1200" height="520" fill="url(#nscan)"/><rect width="1200" height="520" fill="url(#nvig)"/></svg>

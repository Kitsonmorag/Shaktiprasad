<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Radar sweep">
<title>Radar sweep</title><defs>
<linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07271B"/><stop offset=".55" stop-color="#04130D"/><stop offset="1" stop-color="#020A07"/></linearGradient>
<radialGradient id="rgb" cx="10%" cy="15%" r="60%"><stop offset="0" stop-color="#1BF59B" stop-opacity=".26"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></radialGradient>
<radialGradient id="rgm" cx="78%" cy="48%" r="38%"><stop offset="0" stop-color="#6BFFC4" stop-opacity=".30"/><stop offset="1" stop-color="#6BFFC4" stop-opacity="0"/></radialGradient>
<radialGradient id="rgr" cx="92%" cy="90%" r="55%"><stop offset="0" stop-color="#10C48A" stop-opacity=".22"/><stop offset="1" stop-color="#10C48A" stop-opacity="0"/></radialGradient>
<linearGradient id="rray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9FFDD" stop-opacity=".55"/><stop offset="1" stop-color="#B9FFDD" stop-opacity="0"/></linearGradient>
<linearGradient id="rbr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1BF59B"/><stop offset="1" stop-color="#B9FFDD"/></linearGradient>
<pattern id="rgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1BF59B" stroke-opacity=".055"/></pattern>
<pattern id="rscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<radialGradient id="rvig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<filter id="rglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rglowT" x="-700%" y="-700%" width="1500%" height="1500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rglow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rnoise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12301D"/><stop offset=".45" stop-color="#0A1A11"/><stop offset="1" stop-color="#061009"/></linearGradient>
<linearGradient id="rcrt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1BF59B" stop-opacity="0"/><stop offset=".85" stop-color="#1BF59B" stop-opacity=".10"/><stop offset="1" stop-color="#1BF59B" stop-opacity=".30"/></linearGradient>
<linearGradient id="rgloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FFF3" stop-opacity=".17"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#D8FFE4" stop-opacity=".20"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rrayb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DFFC0" stop-opacity=".24"/><stop offset=".6" stop-color="#1BF59B" stop-opacity=".06"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></linearGradient>
<linearGradient id="rtg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#B8FFC9"/><stop offset="1" stop-color="#1BF59B"/></linearGradient>
<linearGradient id="rtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#D7FF8A"/><stop offset="1" stop-color="#8CFF2E"/></linearGradient>
<radialGradient id="rface" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#1BF59B" stop-opacity=".55"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></radialGradient>
<linearGradient id="rfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="rfm"><rect width="2000" height="2000" x="-400" y="-400" fill="url(#rfade)"/></mask>
<linearGradient id="rhair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DFFD2" stop-opacity=".55"/><stop offset=".5" stop-color="#9DFFD2" stop-opacity=".12"/><stop offset="1" stop-color="#9DFFD2" stop-opacity=".35"/></linearGradient>
<clipPath id="rclip"><rect width="600" height="600" rx="0"/></clipPath></defs><style>
.rmono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace}
.rrt{font-family:"MS Gothic","Hiragino Kaku Gothic ProN","Noto Sans Mono CJK JP","Noto Sans CJK JP",ui-monospace,Menlo,Consolas,monospace}
.rmono:not(.rdraw),.rsans{paint-order:stroke;stroke:#03060A;stroke-opacity:.9;stroke-width:2.6px;stroke-linejoin:round}
.rserif{font-family:Georgia,"Times New Roman","Noto Serif","DejaVu Serif",serif}
.rsans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.rup{animation:rup 1s cubic-bezier(.16,1,.3,1) both}
.rchip{animation:rup .7s cubic-bezier(.34,1.56,.64,1) both}
.rrain{animation:rrain linear infinite}
.rpulse{animation:rpulse 2.4s ease-in-out infinite}
.rflick{animation:rflick 6s infinite}
.rdash{stroke-dasharray:6 8;animation:rdash 1.1s linear infinite}
.rtrace{stroke-dasharray:160 840;stroke-dashoffset:1000;animation:rtrace 8s linear infinite}
.rtype{transform-box:fill-box;transform-origin:left center;animation-name:rtype;animation-fill-mode:both}
.rglr{animation:rglr 6s steps(1) infinite;opacity:0}
.rglb{animation:rglb 6s steps(1) infinite;opacity:0}
.rdraw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:rdrawk 3.4s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes rup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rrain{from{transform:translateY(-320px)}to{transform:translateY(600px)}}
@keyframes rpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rflick{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
@keyframes rdash{to{stroke-dashoffset:-14}}
@keyframes rtrace{to{stroke-dashoffset:0}}
@keyframes rtype{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rdrawk{to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes rglr{0%,90%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-5px,0)}93%{opacity:.85;transform:translate(4px,2px)}95%{opacity:.85;transform:translate(-2px,-1px)}96%,100%{opacity:0;transform:none}}
@keyframes rglb{0%,90%{opacity:0;transform:none}91.5%{opacity:.85;transform:translate(5px,1px)}93.5%{opacity:.85;transform:translate(-4px,-2px)}96%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.rup,.rchip,.rrain,.rpulse,.rflick,.rdash,.rtrace,.rglr,.rglb,.rtype{animation:none}.rtrace{display:none}.rdraw{animation:none;stroke-dashoffset:0;fill-opacity:1}}
</style><rect width="600" height="600" fill="none"/><circle cx="300" cy="300" r="60" fill="none" stroke="#1BF59B" stroke-opacity="0.39" /><circle cx="300" cy="300" r="120" fill="none" stroke="#1BF59B" stroke-opacity="0.33" stroke-dasharray="4 6"/><circle cx="300" cy="300" r="180" fill="none" stroke="#1BF59B" stroke-opacity="0.27" /><circle cx="300" cy="300" r="240" fill="none" stroke="#1BF59B" stroke-opacity="0.21" stroke-dasharray="4 6"/><circle cx="300" cy="300" r="290" fill="none" stroke="#1BF59B" stroke-opacity="0.16" /><line x1="10" x2="590" y1="300" y2="300" stroke="#1BF59B" stroke-opacity=".2"/><line y1="10" y2="590" x1="300" x2="300" stroke="#1BF59B" stroke-opacity=".2"/><g><animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="6s" repeatCount="indefinite"/><path d="M300,300 L590,300 A290,290 0 0 0 445.0,48.9 Z" fill="#B9FFDD" fill-opacity=".18"/><line x1="300" y1="300" x2="590" y2="300" stroke="#B9FFDD" stroke-width="2" filter="url(#rglow)"/></g><circle cx="359" cy="416" r="4" fill="#1BF59B" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="3.9s" repeatCount="indefinite"/></circle><circle cx="415" cy="503" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="432" cy="180" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="3.8s" repeatCount="indefinite"/></circle><circle cx="114" cy="285" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="109" cy="180" r="4" fill="#1BF59B" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="2.0s" repeatCount="indefinite"/></circle><circle cx="194" cy="500" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="1.9s" repeatCount="indefinite"/></circle><circle cx="443" cy="127" r="4" fill="#1BF59B" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="123" cy="527" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="2.0s" repeatCount="indefinite"/></circle><circle cx="163" cy="532" r="4" fill="#FF5C72" filter="url(#rglow)"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle></svg>

@keyframes zrain{from{transform:translateY(-320px)}to{transform:translateY(520px)}}
@keyframes zpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes zflick{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
@keyframes zdash{to{stroke-dashoffset:-14}}
@keyframes ztrace{to{stroke-dashoffset:0}}
@keyframes ztype{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes zdrawk{to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes zglr{0%,90%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-5px,0)}93%{opacity:.85;transform:translate(4px,2px)}95%{opacity:.85;transform:translate(-2px,-1px)}96%,100%{opacity:0;transform:none}}
@keyframes zglb{0%,90%{opacity:0;transform:none}91.5%{opacity:.85;transform:translate(5px,1px)}93.5%{opacity:.85;transform:translate(-4px,-2px)}96%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.zup,.zchip,.zrain,.zpulse,.zflick,.zdash,.ztrace,.zglr,.zglb,.ztype{animation:none}.ztrace{display:none}.zdraw{animation:none;stroke-dashoffset:0;fill-opacity:1}}

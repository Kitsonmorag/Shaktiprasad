  <g font-family="Arial,Helvetica,sans-serif"><text x="70" y="78" fill="#b9a9cc" font-size="13" font-weight="700" letter-spacing="4">OFFENSIVE SECURITY / CYBER DEFENSE</text><text x="67" y="149" fill="#f3f3f8" font-size="48" font-weight="700" letter-spacing="-2">Shakti Prasad</text><text x="67" y="202" fill="#f3f3f8" font-size="48" font-weight="700" letter-spacing="-2">Mahapatro</text><rect x="70" y="231" width="30" height="2" rx="1" fill="#ba7aff"/><text x="111" y="237" fill="#a2a4b4" font-size="13" letter-spacing="1.2">PENETRATION TESTING · DETECTION &amp; RESPONSE · GRC</text></g>

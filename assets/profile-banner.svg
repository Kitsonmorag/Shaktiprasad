    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4b59"/><stop offset=".5" stop-color="#ba7aff"/><stop offset="1" stop-color="#5e9dff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a34dd1" stop-opacity=".2"/><stop offset="1" stop-color="#a34dd1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfc3df" stroke-opacity=".07"/></pattern>

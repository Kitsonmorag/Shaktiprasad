<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="Heartbeat divider">
<title>Heartbeat divider</title><defs>
<linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07271B"/><stop offset=".55" stop-color="#04130D"/><stop offset="1" stop-color="#020A07"/></linearGradient>
<radialGradient id="dgb" cx="10%" cy="15%" r="60%"><stop offset="0" stop-color="#1BF59B" stop-opacity=".26"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></radialGradient>
<radialGradient id="dgm" cx="78%" cy="48%" r="38%"><stop offset="0" stop-color="#6BFFC4" stop-opacity=".30"/><stop offset="1" stop-color="#6BFFC4" stop-opacity="0"/></radialGradient>
<radialGradient id="dgr" cx="92%" cy="90%" r="55%"><stop offset="0" stop-color="#10C48A" stop-opacity=".22"/><stop offset="1" stop-color="#10C48A" stop-opacity="0"/></radialGradient>
<linearGradient id="dray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9FFDD" stop-opacity=".55"/><stop offset="1" stop-color="#B9FFDD" stop-opacity="0"/></linearGradient>
<linearGradient id="dbr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1BF59B"/><stop offset="1" stop-color="#B9FFDD"/></linearGradient>
<pattern id="dgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1BF59B" stroke-opacity=".055"/></pattern>
<pattern id="dscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<radialGradient id="dvig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<filter id="dglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="dglowT" x="-700%" y="-700%" width="1500%" height="1500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="dglow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="dnoise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12301D"/><stop offset=".45" stop-color="#0A1A11"/><stop offset="1" stop-color="#061009"/></linearGradient>
<linearGradient id="dcrt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1BF59B" stop-opacity="0"/><stop offset=".85" stop-color="#1BF59B" stop-opacity=".10"/><stop offset="1" stop-color="#1BF59B" stop-opacity=".30"/></linearGradient>
<linearGradient id="dgloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FFF3" stop-opacity=".17"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="dsheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#D8FFE4" stop-opacity=".20"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="drayb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DFFC0" stop-opacity=".24"/><stop offset=".6" stop-color="#1BF59B" stop-opacity=".06"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></linearGradient>
<linearGradient id="dtg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#B8FFC9"/><stop offset="1" stop-color="#1BF59B"/></linearGradient>
<linearGradient id="dtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#D7FF8A"/><stop offset="1" stop-color="#8CFF2E"/></linearGradient>
<radialGradient id="dface" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#1BF59B" stop-opacity=".55"/><stop offset="1" stop-color="#1BF59B" stop-opacity="0"/></radialGradient>
<linearGradient id="dfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="dfm"><rect width="2000" height="2000" x="-400" y="-400" fill="url(#dfade)"/></mask>
<linearGradient id="dhair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DFFD2" stop-opacity=".55"/><stop offset=".5" stop-color="#9DFFD2" stop-opacity=".12"/><stop offset="1" stop-color="#9DFFD2" stop-opacity=".35"/></linearGradient>
<clipPath id="dclip"><rect width="1200" height="70" rx="0"/></clipPath></defs><style>
.dmono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace}
.drt{font-family:"MS Gothic","Hiragino Kaku Gothic ProN","Noto Sans Mono CJK JP","Noto Sans CJK JP",ui-monospace,Menlo,Consolas,monospace}
.dmono:not(.ddraw),.dsans{paint-order:stroke;stroke:#03060A;stroke-opacity:.9;stroke-width:2.6px;stroke-linejoin:round}
.dserif{font-family:Georgia,"Times New Roman","Noto Serif","DejaVu Serif",serif}
.dsans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.dup{animation:dup 1s cubic-bezier(.16,1,.3,1) both}
.dchip{animation:dup .7s cubic-bezier(.34,1.56,.64,1) both}
.drain{animation:drain linear infinite}
.dpulse{animation:dpulse 2.4s ease-in-out infinite}
.dflick{animation:dflick 6s infinite}
.ddash{stroke-dasharray:6 8;animation:ddash 1.1s linear infinite}
.dtrace{stroke-dasharray:160 840;stroke-dashoffset:1000;animation:dtrace 8s linear infinite}
.dtype{transform-box:fill-box;transform-origin:left center;animation-name:dtype;animation-fill-mode:both}
.dglr{animation:dglr 6s steps(1) infinite;opacity:0}
.dglb{animation:dglb 6s steps(1) infinite;opacity:0}
.ddraw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:ddrawk 3.4s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes dup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drain{from{transform:translateY(-320px)}to{transform:translateY(70px)}}
@keyframes dpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes dflick{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
@keyframes ddash{to{stroke-dashoffset:-14}}
@keyframes dtrace{to{stroke-dashoffset:0}}
@keyframes dtype{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ddrawk{to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes dglr{0%,90%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-5px,0)}93%{opacity:.85;transform:translate(4px,2px)}95%{opacity:.85;transform:translate(-2px,-1px)}96%,100%{opacity:0;transform:none}}
@keyframes dglb{0%,90%{opacity:0;transform:none}91.5%{opacity:.85;transform:translate(5px,1px)}93.5%{opacity:.85;transform:translate(-4px,-2px)}96%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.dup,.dchip,.drain,.dpulse,.dflick,.ddash,.dtrace,.dglr,.dglb,.dtype{animation:none}.dtrace{display:none}.ddraw{animation:none;stroke-dashoffset:0;fill-opacity:1}}
</style><path id="dp" d="M0 35 H380 L400 35 L410 12 L424 58 L436 24 L446 35 H760 L780 35 L790 14 L804 56 L816 26 L826 35 H1200" fill="none" stroke="#8FB8A5" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M0 35 H380 L400 35 L410 12 L424 58 L436 24 L446 35 H760 L780 35 L790 14 L804 56 L816 26 L826 35 H1200" fill="none" stroke="url(#dbr)" stroke-width="2" pathLength="1000" class="dtrace" style="stroke-dasharray:140 860" filter="url(#dglow)"/>
    <path d="M0 35 H380 L400 35 L410 12 L424 58 L436 24 L446 35 H760 L780 35 L790 14 L804 56 L816 26 L826 35 H1200" fill="none" stroke="#B9FFDD" stroke-width="2" pathLength="1000" class="dtrace" style="stroke-dasharray:60 940;animation-delay:-3s;animation-duration:5s" filter="url(#dglow)"/><rect x="35" y="30" width="10" height="10" transform="rotate(45 40 35)" fill="#030805" stroke="#1BF59B" stroke-width="1.5"/><rect x="1155" y="30" width="10" height="10" transform="rotate(45 1160 35)" fill="#030805" stroke="#FF5C72" stroke-width="1.5"/><rect x="595" y="30" width="10" height="10" transform="rotate(45 600 35)" fill="#030805" stroke="#B9FFDD" stroke-width="1.5"/>
    <text class="dmono" x="600" y="64" text-anchor="middle" font-size="9" letter-spacing="6" fill="#8FB8A5" fill-opacity=".6">// SYSTEM SECURE</text></svg>
